name: MCP Server CI

on:
  pull_request:
    paths:
      - "mcp-server/**"
      - ".github/workflows/ci-mcp.yml"
  push:
    branches:
      - main
    paths:
      - "mcp-server/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Smoke-load built module
        run: node -e "require('./dist/index.js'); console.log('module loads')"
