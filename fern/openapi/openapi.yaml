          description: Free-text campaign description; required. Drives the discoverQueryNarratives call internally.
        audience:
          type: string
          description: Free-text audience descriptor (e.g. "fitness-curious millennials"). Carried into the response context for downstream LLM consumption; not used as a retrieval filter.
        platforms:
          type: array
          items:
            type: string
        tone:
          type: string
          description: Free-text tone hint (e.g. "confident, specific, culturally aware"). Carried into the response context; not used as a retrieval filter.
        limit:
          type: integer
          minimum: 100
          maximum: 50000
          default: 1000
        window:
          $ref: "#/components/schemas/QueryWindow"
    CampaignBriefResponse:
      type: object
      required: [id, createdAt, brief, context]
      properties:
        id:
          type: integer
        createdAt:
          type: string
          format: date-time
        brief:
          $ref: "#/components/schemas/CampaignBrief"
        context:
          $ref: "#/components/schemas/CampaignContext"
    CampaignBrief:
      type: object
