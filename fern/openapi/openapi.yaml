    JobKind:
      type: string
      description: Discriminator for which pipeline runs the job.
      enum:
        - intelligence_search
        - intelligence_discover
        - campaign_brief
        - llm_context
    JobStatus:
      type: string
      enum:
        - queued
        - running
        - succeeded
        - failed
    JobSubmitRequest:
      description: |
        Discriminated union by `kind`. Each variant pins `input` to the schema
        the corresponding pipeline expects (`QueryIntelligenceRequest` for the
        retrieval kinds, `CampaignBriefRequest` for the campaign kinds).

        Set `input.debug = true` on any variant to bypass dedup + result cache
        (useful when you want a fresh run after deploying changes).
      oneOf:
        - $ref: "#/components/schemas/IntelligenceSearchJobRequest"
        - $ref: "#/components/schemas/IntelligenceDiscoverJobRequest"
        - $ref: "#/components/schemas/CampaignBriefJobRequest"
        - $ref: "#/components/schemas/LlmContextJobRequest"
      discriminator:
        propertyName: kind
        mapping:
          intelligence_search: "#/components/schemas/IntelligenceSearchJobRequest"
          intelligence_discover: "#/components/schemas/IntelligenceDiscoverJobRequest"
          campaign_brief: "#/components/schemas/CampaignBriefJobRequest"
          llm_context: "#/components/schemas/LlmContextJobRequest"
    IntelligenceSearchJobRequest:
      type: object
      required: [kind, input]
      description: Live multimodal retrieval — ranked content only.
      properties:
        kind:
          type: string
          enum: [intelligence_search]
        input:
          $ref: "#/components/schemas/QueryIntelligenceRequest"
    IntelligenceDiscoverJobRequest:
      type: object
      required: [kind, input]
      description: Live retrieval + narratives + LLM analytics + arbitrage signals.
      properties:
        kind:
          type: string
          enum: [intelligence_discover]
        input:
          $ref: "#/components/schemas/QueryIntelligenceRequest"
    CampaignBriefJobRequest:
      type: object
      required: [kind, input]
      description: Live discovery + persisted campaign brief.
      properties:
        kind:
          type: string
          enum: [campaign_brief]
        input:
          $ref: "#/components/schemas/CampaignBriefRequest"
    LlmContextJobRequest:
      type: object
      required: [kind, input]
      description: Same evidence bundle as `campaign_brief`, no prose, no save.
      properties:
        kind:
          type: string
          enum: [llm_context]
        input:
          $ref: "#/components/schemas/CampaignBriefRequest"
    JobSubmitAcceptedResponse:
      type: object
      required: [jobId, status, statusUrl]
      properties:
        jobId:
          type: string
        status:
          $ref: "#/components/schemas/JobStatus"
        statusUrl:
          type: string
          example: /intelligence/jobs/01931f7e-...
        dedup:
          type: boolean
          description: Present (true) when this jobId was reused for an in-flight identical request.
    JobSubmitCacheHitResponse:
      type: object
      required: [jobId, status, fromCache, result]
      properties:
        jobId:
          type: string
        status:
          type: string
          enum: [succeeded]
        fromCache:
          type: boolean
        result:
          description: |
            Per-kind result payload:
              - `intelligence_search` → IntelligenceSearchResponse
              - `intelligence_discover` → QueryNarrativeDiscoveryResponse
              - `campaign_brief` → CampaignBriefResponse
              - `llm_context` → LlmContextResponse
    Job:
      type: object
      required: [jobId, kind, status, submittedAt]
      properties:
        jobId:
          type: string
        kind:
          $ref: "#/components/schemas/JobKind"
        status:
          $ref: "#/components/schemas/JobStatus"
        submittedAt:
          type: integer
          format: int64
          description: Unix epoch milliseconds when the submit Lambda accepted the job.
        startedAt:
          type: integer
          format: int64
          description: Unix epoch milliseconds when the worker claimed the job.
        completedAt:
          type: integer
          format: int64
          description: Unix epoch milliseconds when the worker wrote the terminal result.
        result:
          description: |
            Present once `status: succeeded`. Per-kind payload:
              - `intelligence_search` → IntelligenceSearchResponse
              - `intelligence_discover` → QueryNarrativeDiscoveryResponse
              - `campaign_brief` → CampaignBriefResponse
              - `llm_context` → LlmContextResponse

            Large results (>300 KB) are spilled to S3 by the worker; the
            status handler rehydrates them transparently so callers always
            see the inline payload here.
        error:
          type: string
          description: "Present once `status: failed`. Human-readable failure reason."
