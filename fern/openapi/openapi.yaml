          type: number
    TagNarrativeRole:
      type: object
      required: [tag, frequency, dominantNarrativeId, dominantNarrativeLabel, exclusivity, role, platformCount, avgEngagement, engagementPremiumPct]
      properties:
        tag:
          type: string
        frequency:
          type: integer
        dominantNarrativeId:
          type: string
        dominantNarrativeLabel:
          type: string
        exclusivity:
          type: number
        role:
          type: string
          enum: [Signature, Bridge, Shared]
        platformCount:
          type: integer
        avgEngagement:
          type: number
        engagementPremiumPct:
          type: number
    QueryCreator:
      type: object
      required: [platform, handle, contentCount, totalEngagement, avgFinalScore, amplifierScore]
      properties:
        creatorId:
          type: integer
          nullable: true
        platform:
          type: string
        handle:
          type: string
        followerCount:
          type: integer
          nullable: true
        contentCount:
          type: integer
        totalEngagement:
          type: integer
        avgFinalScore:
          type: number
        amplifierScore:
          type: number
    PlatformOpportunity:
      type: object
      required: [narrativeId, narrativeLabel, dominantPlatform, platformDistribution, platformConcentration, avgEngagement, baselineEngagement, engagementPremiumPct, opportunityScore, contentCount, creatorCount, opportunity]
      description: |
        Per-narrative platform-arbitrage signal. Computed from the FULL cluster
        (every row referenced by `narrative.contentUuids`), not just the top-8
        representative content. High `opportunityScore` flags narratives that
        engage strongly AND are concentrated on one platform — i.e. there's
        room to adapt the format for adjacent platforms.
      properties:
        narrativeId:
          type: string
          description: Matches `QueryNarrative.id`.
        narrativeLabel:
          type: string
          description: LLM-generated narrative label (post-relabeling).
        dominantPlatform:
          type: string
        platformDistribution:
          type: object
          additionalProperties:
            type: number
          description: Share of cluster content per platform, summing to 1.0.
        platformConcentration:
          type: number
          description: Dominant platform's share (0–1). 1.0 = single-platform cluster.
        avgEngagement:
          type: number
          description: Mean `engagementScore` across the full cluster.
        baselineEngagement:
          type: number
          description: Mean `engagementScore` across all content in this query (the global comparison point).
        engagementPremiumPct:
          type: number
          description: (avgEngagement - baselineEngagement) / baselineEngagement * 100.
        opportunityScore:
          type: number
          description: max(0, engagementPremiumPct/100) * platformConcentration. Sorted descending.
        contentCount:
          type: integer
          description: Number of content rows in the cluster.
        creatorCount:
          type: integer
          description: Distinct `authorHandle` count in the cluster.
        opportunity:
          type: string
          description: |
            Static fallback prose — one of two strings depending on whether the
            cluster is single-platform or cross-platform. Real arbitrage prose
            lives in the response-level `insights` array (LLM-generated).
    TagSignal:
      type: object
      required: [tag, count, dominantPlatform, platformConcentration, platformDistribution, avgEngagement, baselineEngagement, engagementPremiumPct, opportunityScore]
      description: |
        Per-tag arbitrage signal. Tags need at least 3 occurrences in the
        ranked result set to be reported. `opportunityScore` = engagement
        premium normalized 0–1 across the surviving cohort, multiplied by
        platform concentration. Sorted descending in the response.
      properties:
        tag:
          type: string
          description: Lowercase, trimmed.
        count:
          type: integer
          description: Number of (tag, content) occurrences in the result set.
        dominantPlatform:
          type: string
        platformConcentration:
          type: number
          description: Dominant platform's share of this tag's occurrences (0–1).
        platformDistribution:
          type: object
          additionalProperties:
            type: number
          description: Share of this tag per platform.
        avgEngagement:
          type: number
        baselineEngagement:
          type: number
          description: Global baseline = mean engagementScore across the entire ranked set for this query.
        engagementPremiumPct:
          type: number
        opportunityScore:
          type: number
    NarrativeAttributeLift:
      type: object
      required: [narrativeId, narrativeLabel, lifts]
      description: |
        Per-narrative tag lift. For each tag inside the cluster (when both the
        with-tag and without-tag groups have ≥3 rows), reports how much higher
        or lower engagement is when the tag is present vs absent.
      properties:
        narrativeId:
          type: string
        narrativeLabel:
          type: string
          description: LLM label, kept in sync with the relabeled narrative.
        lifts:
          type: array
          items:
            $ref: "#/components/schemas/AttributeLiftEntry"
    AttributeLiftEntry:
      type: object
      required: [tag, liftPct, countWith, countWithout, avgWith, avgWithout]
      properties:
        tag:
          type: string
        liftPct:
          type: number
          description: (avgWith - avgWithout) / avgWithout * 100. Positive = tag boosts engagement.
        countWith:
          type: integer
          description: Cluster rows that carry this tag.
        countWithout:
          type: integer
          description: Cluster rows that do not carry this tag.
        avgWith:
          type: number
          description: Mean engagementScore among rows carrying this tag.
        avgWithout:
          type: number
          description: Mean engagementScore among rows without this tag.
    CampaignBriefRequest:
      type: object
      required: [campaign]
      properties:
        campaign:
