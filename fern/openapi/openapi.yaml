      properties:
        campaign:
          type: string
        input:
          type: object
          additionalProperties: true
        narratives:
          type: array
          items:
            type: object
            additionalProperties: true
        topTags:
          type: array
          items:
            type: string
        creators:
          type: array
          items:
            type: object
            additionalProperties: true
        representativeContent:
          type: array
          items:
            type: object
            additionalProperties: true
        sourceNarrativeIds:
