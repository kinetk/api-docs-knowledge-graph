    QueryGraph:
      type: object
      required: [nodes, edges]
      properties:
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/QueryGraphNode"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/QueryGraphEdge"
    QueryGraphNode:
      type: object
      required: [id, type, label]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [content, tag, creator, narrative]
        label:
          type: string
        score:
          type: number
        creatorId:
          type: integer
          description: |
            Populated only on `type: creator` nodes. Stable `creators.id`
            primary key — use as the path param for `GET /creators/{id}`
            and to join against `creators[].creatorId` in the same response.
            Creator content rows missing a normalized `creator_id` are
            excluded from the graph entirely, so this field is always set
            when present.
    QueryGraphEdge:
      type: object
      required: [source, target, type, weight]
      properties:
        source:
          type: string
        target:
          type: string
        type:
          type: string
          enum: [semantic_similarity, tag_overlap, creator_posted, tagged_with, contains]
        weight:
          type: number
    QueryNarrative:
      type: object
      required: [id, label, summary, trendScore, contentCount, creatorCount, platformCount, totalEngagement, topTags, representativeContent, contentUuids, scoreBreakdown]
      properties:
        id:
          type: string
        label:
          type: string
        summary:
          type: string
        trendScore:
          type: number
        contentCount:
          type: integer
        creatorCount:
          type: integer
        platformCount:
          type: integer
        totalEngagement:
          type: integer
        topTags:
          type: array
          items:
            type: string
        representativeContent:
          type: array
          items:
            $ref: "#/components/schemas/RankedContent"
        contentUuids:
          type: array
          items:
            type: string
        scoreBreakdown:
          type: object
          required: [engagementStrength, creatorDiversity, platformSpread, recencyStrength]
          properties:
            engagementStrength:
              type: number
            creatorDiversity:
              type: number
            platformSpread:
              type: number
            recencyStrength:
              type: number
    QueryTopTag:
      type: object
      required: [tag, frequency, avgEngagement, momentumScore]
      properties:
        tag:
