          type: string
        positioning:
          type: array
          items:
            type: string
        narrativesToRide:
          type: array
          items:
            type: object
            additionalProperties: true
        emergingNarrativesToTest:
          type: array
          items:
            type: string
        topTags:
          type: array
          items:
            type: string
        creatorArchetypes:
          type: array
          items:
            type: string
        recommendedCreators:
          type: array
          items:
            type: object
            additionalProperties: true
        platformStrategy:
          type: array
          items:
            type: object
            additionalProperties: true
        contentAngles:
          type: array
          items:
            type: string
        evidence:
