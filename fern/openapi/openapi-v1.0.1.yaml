      type: object
    IJobStatusResponse:
      additionalProperties: false
      properties:
        completedAt:
          type: number
        error:
          type: string
        jobId:
          type: string
        kind:
          $ref: "#/components/schemas/JobKind"
        result:
          anyOf:
            - $ref: "#/components/schemas/IRecordsJobResult"
            - $ref: "#/components/schemas/IInsightsJobResult"
            - $ref: "#/components/schemas/IPatternsJobResult"
            - $ref: "#/components/schemas/IStatsJobResult"
        resultBytes:
          description: Size of the stored result in bytes (present alongside resultUrl).
          type: number
        resultExpiresAt:
          description: ISO-8601 expiry of resultUrl (clamped to the job's own retention).
          type: string
        resultStorage:
          enum:
            - s3
          description: >-
            Set to "s3" when the result was too large to return inline; in that
            case

            `result` is omitted and `resultUrl` holds a short-lived presigned download

            URL instead. Fetch the URL directly; re-poll for a fresh one after it

            expires (see resultExpiresAt).
          type: string
        resultUrl:
          description: Short-lived presigned GET URL for a large result (present iff
            resultStorage === "s3").
          type: string
        startedAt:
          type: number
        status:
          $ref: "#/components/schemas/JobStatus"
        submittedAt:
          type: number
      required:
        - jobId
        - kind
        - status
        - submittedAt
      type: object
    IJobSubmitResponse:
      additionalProperties: false
      properties:
        dedup:
          type: boolean
        estimated_cost:
          description: >-
            Upper-bound credit estimate for this run, priced on the (possibly

            server-derived) analysis depth + the includeSignals add-on. This is the

            HOLD placed on billed keys; settlement bills the records actually

            analyzed and refunds the difference. Informational (never charged) for

            internal/admin keys.
          type: number
        fromCache:
          type: boolean
        jobId:
          type: string
        result:
          anyOf:
            - $ref: "#/components/schemas/IRecordsJobResult"
            - $ref: "#/components/schemas/IInsightsJobResult"
            - $ref: "#/components/schemas/IPatternsJobResult"
            - $ref: "#/components/schemas/IStatsJobResult"
        resultBytes:
          description: Size of the stored result in bytes (present alongside resultUrl).
          type: number
        resultExpiresAt:
          description: ISO-8601 expiry of resultUrl (clamped to the job's own retention).
          type: string
        resultStorage:
          enum:
            - s3
          description: >-
            Set to "s3" when the result was too large to return inline; in that
            case

            `result` is omitted and `resultUrl` holds a short-lived presigned download

            URL instead. Fetch the URL directly; re-poll for a fresh one after it

            expires (see resultExpiresAt).
          type: string
        resultUrl:
          description: Short-lived presigned GET URL for a large result (present iff
            resultStorage === "s3").
          type: string
        status:
          $ref: "#/components/schemas/JobStatus"
        statusUrl:
          type: string
      required:
        - jobId
        - status
      type: object
