  /search:
    post:
      operationId: search
      summary: Synchronous search — content, narratives, patterns and creators in one
        call
      description: >
        One bounded call an agent can make many times per task. Returns typed,

        LLM-ready objects straight from the corpus and the precomputed maps:


        - `content` — up to `limit` ranked rows from one capped multimodal
          retrieval (default 100, max 300), each carrying the `narrativeIds` and
          `patternKeys` it belongs to so you can walk into
          `GET /narratives/{id}` and `GET /intelligence/patterns/{patternKey}`.
        - `narratives` — up to 10 precomputed narratives that match the query
          (never padded with trending narratives when nothing matches).
        - `patterns` — up to 5 map-first pattern matches, without the prose.
          Currently switched off on `/search` (always `[]`) until loading the
          pattern map moves off the request path; content rows still carry
          `patternKeys`, and `GET /intelligence/patterns/*` is unaffected.
        - `creators` — an aggregate of who authored the returned content rows
          (numeric id, platform, hits, reach; never a handle).

        Deep analysis (statistics, discovery, LLM-written insight) is what

        `POST /intelligence/jobs` is for. `window` is `7d`, `30d` or `all` (default

        `30d`). `all` retrieves with no time bound; no narrative map is built for

        it, so its precomputed narratives come from the 30d map, while narratives

        formed from its own content carry `window_key: all`. A `limit` above 300

        belongs to a `records` job and is rejected with `400`, as is an empty

        `types` list and `creators` without `content` (creators are derived from

        the content rows).


        Pricing: $0.010 per content row returned (the `records` rate) when the

        `content` arm runs. The hold is `limit` × $0.010; the settle on a `200`

        charges the rows actually returned and releases the rest, so an empty

        answer costs nothing. `types` without `content` (e.g. `["narratives"]`) runs no

        retrieval and costs nothing. A client `Idempotency-Key` header collapses

        retries of the same logical request (same account, same canonical body)

        onto one charge; without it every call is charged.


        Degradation: the free `narratives` and `patterns` arms are best-effort.

        Whether an arm failed, ran out of budget or simply matched nothing, it

        returns `[]`, and the response does not distinguish those cases — a search

        is answered by its `content`. A failed `content` arm is different: it fails

        the whole request with no charge, or becomes the `202`.


        Response shapes:

        - `200` — the search result; `usage.credits` and the credit headers
          report what this call charged.
        - `202` — the content retrieval exceeded the synchronous budget. The
          search hold was refunded and the same question was handed to an async
          `insights` job (100 records, no signals, at that kind's own price and
          hold); poll `statusUrl`. `status` is the job's real state, which can already be
          `succeeded` when the submit collapsed onto a cached result.
        - `402` — insufficient credits for the `limit` × $0.010 hold (or, on the `202` path,
          for the insights job); the body recommends how to fit your budget.
        - `429` — rate limited by the API Gateway usage plan; honour `Retry-After`.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ISearchBody"
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ISearchResponse"
          headers:
            X-Kinetk-Credits-Used:
              $ref: "#/components/headers/CreditsUsed"
            X-Kinetk-Credits-Remaining:
              $ref: "#/components/headers/CreditsRemaining"
        "202":
          description: "Accepted for async completion: the content arm exceeded the
            synchronous budget, the search hold was refunded, and an `insights`
            job was submitted. Poll `statusUrl`. The credit headers report the
            job's hold, not the search fee."
          headers:
            X-Kinetk-Credits-Used:
              $ref: "#/components/headers/CreditsUsed"
            X-Kinetk-Credits-Remaining:
              $ref: "#/components/headers/CreditsRemaining"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ISearchAcceptedResponse"
        "400":
          description: "Rejected input: `window` other than `7d`/`30d`/`all`, `limit`
            above 300 or not a positive integer, an empty `types` list,
            `creators` without `content`, an unsupported platform or type, or an
            undeclared field."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "402":
          description: Insufficient credits. The body reports the credits required vs
            available plus budget recommendations (max affordable limit, top-up
            URL).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IInsufficientCreditsResponse"
        default:
          $ref: "#/components/responses/Error"
  /usage:
    get:
      operationId: usage
      summary: Credit usage history for your account
