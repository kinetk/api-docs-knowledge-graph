info:
  title: KINETK Graph Service API
  version: 1.0.1
  description: >
    Public HTTP API for the KINETK graph-service. Health/sync probe,

    precomputed narrative reads, a synchronous `POST /search` for agents in a

    loop, and an async job queue for query statistics and other heavy

    intelligence work (`records`, `insights`,

    `patterns`, `stats`).


    Authentication: send your secret key in the `x-api-key` header on every

    request. Keys are issued from the billing dashboard and shown only once.


    Billing: calls are metered in credits (1 credit = $1.00). `POST /search`

    costs $0.010 per content row returned — the same as a `records` record —

    when its `content` arm runs and is free otherwise, charged only on a `200`. Async intelligence jobs:

    `records` costs $0.010 per record and `insights` $0.015 per record, both

    charged on the records actually returned/analyzed; `patterns` is a flat

    $10.00 per call and `stats` a flat $5.00 per call, whatever the query asks

    for. `includeSignals` adds a flat $1.00 to an insights call. Price never

    depends on the `window` you query.


    `POST /intelligence/jobs` returns an `estimated_cost`, an UPPER BOUND for the

    per-record kinds: you are charged the ACTUAL cost once the job completes and

    the unused remainder of the reservation is released. The flat-fee kinds settle

    at their fee even when the answer is empty — only a FAILED job is refunded.

    If your balance can't cover a call you get `402` with a recommendation for how

    to fit your remaining budget. Every successful response carries

    `X-Kinetk-Credits-Used` and `X-Kinetk-Credits-Remaining` headers.


    Cached answers: `records` and `insights` cache-hits are charged at the full

    rate (no cache discount). `patterns` and `stats` answers are cached until the

    next 00:00 UTC, and re-reading one you already paid for is free until then;

    a different account asking the same question pays the full fee. Precomputed

    narrative/creator reads are free.
  contact:
    name: KINETK Engineering
  license:
    name: Proprietary
