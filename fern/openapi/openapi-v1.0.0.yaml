          type: string
        jobId:
          type: string
        kind:
          $ref: "#/components/schemas/JobKind"
        result:
          anyOf:
            - $ref: "#/components/schemas/IRecordsJobResult"
            - $ref: "#/components/schemas/IInsightsJobResult"
        resultBytes:
          description: Size of the stored result in bytes (present alongside resultUrl).
          type: number
        resultExpiresAt:
          description: ISO-8601 expiry of resultUrl (clamped to the job's own retention).
          type: string
        resultStorage:
          enum:
            - s3
          description: >-
            Set to "s3" when the result was too large to return inline; in that
            case

            `result` is omitted and `resultUrl` holds a short-lived presigned download

            URL instead. Fetch the URL directly; re-poll for a fresh one after it

            expires (see resultExpiresAt).
          type: string
        resultUrl:
          description: Short-lived presigned GET URL for a large result (present iff
            resultStorage === "s3").
          type: string
        startedAt:
          type: number
        status:
          $ref: "#/components/schemas/JobStatus"
        submittedAt:
          type: number
      required:
        - jobId
        - kind
        - status
        - submittedAt
      type: object
