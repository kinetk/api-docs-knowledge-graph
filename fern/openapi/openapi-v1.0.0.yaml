  /intelligence/jobs:
    post:
      operationId: intelligenceJobsSubmit
      summary: Submit an async intelligence job
      description: >
        Submit a job for async execution. Request body is `{ kind, input }`

        discriminated by `kind`.


        Response shapes:

        - `200 + { fromCache: true, result, charged }` — identical recent job
          within the per-kind freshness window; cached result returned
          synchronously and charged at full rate (no cache discount).
        - `202 + { dedup: true }` — identical job currently queued/running;
          reuses the in-flight `jobId`.
        - `202 + { estimated_cost }` — new job accepted; the credits were
          reserved at the estimate. Poll `GET /intelligence/jobs/{id}`.
        - `402` — insufficient credits; body recommends how to fit your budget.


        For `records` / `insights`, `window`

        (in `input`) is REQUIRED — it drives the credit price (fresher windows

        cost more). `estimated_cost` is an upper bound; the final charge is computed

        from the records actually returned.


        Input validation is strict: any undeclared field, type mismatch, or

        out-of-enum value is rejected with `400` (nothing is silently stripped or

        coerced).
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/IQueryJobSubmitBody"
                # - $ref: "#/components/schemas/ICampaignJobSubmitBody"
              discriminator:
                propertyName: kind
                mapping:
                  insights: "#/components/schemas/IQueryJobSubmitBody"
                  records: "#/components/schemas/IQueryJobSubmitBody"
                  # campaign: "#/components/schemas/ICampaignJobSubmitBody"
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IJobSubmitResponse"
          headers:
            X-Kinetk-Credits-Used:
              $ref: "#/components/headers/CreditsUsed"
            X-Kinetk-Credits-Remaining:
              $ref: "#/components/headers/CreditsRemaining"
        "402":
          description: Insufficient credits. The body reports the credits required vs
            available plus budget recommendations (max affordable limit, cheaper
            windows, top-up URL).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IInsufficientCreditsResponse"
        default:
          $ref: "#/components/responses/Error"
  "/intelligence/jobs/{id}":
    get:
      operationId: intelligenceJobsStatus
      summary: Poll an async job — status + final result
      description: >
        Returns the job's current state. All states (`queued`, `running`,

        `succeeded`, `failed`) return `200`; `404` for an unknown `jobId`, `410`

        once the result has expired (~24h after completion).


        On `succeeded`, `result` usually carries the per-kind payload inline.

        When a result is too large to return inline, `result` is omitted and the

        response instead carries `resultStorage: "s3"` plus a short-lived presigned

        `resultUrl` (with `resultBytes` and `resultExpiresAt`) — fetch that URL

        directly to download the full payload, and re-poll for a fresh URL if it

        expires. Recommended polling cadence: every 2–5 seconds. Typical

        end-to-end run: 5–20 s.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            minLength: 1
            type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IJobStatusResponse"
          headers:
            X-Kinetk-Credits-Used:
              $ref: "#/components/headers/CreditsUsed"
            X-Kinetk-Credits-Remaining:
              $ref: "#/components/headers/CreditsRemaining"
        default:
