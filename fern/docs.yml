instances:
  - url: kinetk.docs.buildwithfern.com
    custom-domain: docs.kinetk.ai

title: KINETK Graph Service API

# First version listed is the default (unversioned URLs); others get /<version>/... paths.
versions:
  - display-name: v1.0.1
    path: ./versions/v1.0.1.yml

colors:
  # Palette from the kinetk.ai website (kinetk-main-website/app/globals.css).
  # Light mode matches the site; dark mode uses the site's warm code-block palette.
  accent-primary:
    light: "#6B4FC0"  # brand purple (5.56:1 on paper)
    dark: "#B9A6F0"   # code-purple, readable on the dark ground
  background:
    light: "#FAF6EF"  # paper. The site never uses pure white
    dark: "#16130E"   # code-bg, warm near-black
  card-background:
    light: "#FFFDF8"  # paper-raised
    dark: "#1F1B15"
  sidebar-background:
    light: "#FAF6EF"
    dark: "#16130E"
  header-background:
    light: "#FAF6EF"
    dark: "#16130E"
  border:
    light: "#D9D6D0"  # border-hairline
    dark: "#2E2921"

# Custom fonts (Inter for body, Bebas Neue for headings — matches kinetk.ai).
# Re-enable once WOFF2 files are added under ./assets/fonts/.
# typography:
#   bodyFont:
#     name: Inter
#     path: ./assets/fonts/Inter-Regular.woff2
#   headingsFont:
#     name: Bebas Neue
#     path: ./assets/fonts/BebasNeue-Regular.woff2

logo:
  href: https://kinetk.ai

favicon: ./assets/favicon.ico

navbar-links:
  - type: minimal
    text: kinetk.ai
    url: https://kinetk.ai
  - type: filled
    text: Get Your API Key
    url: https://platform.kinetk.ai
