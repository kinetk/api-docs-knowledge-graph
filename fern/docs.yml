instances:
  - url: kinetk.docs.buildwithfern.com
    custom-domain: docs.kinetk.ai

title: KINETK Graph Service API

# First version listed is the default (unversioned URLs); others get /v1.0.0/... paths.
versions:
  - display-name: v1.0.1
    path: ./versions/v1.0.1.yml
  - display-name: v1.0.0
    path: ./versions/v1.0.0.yml

colors:
  accent-primary:
    light: "#1A8A9C"  # darker teal — meets WCAG contrast on white
    dark: "#26AEC0"   # primary brand teal — works on black
  background:
    light: "#FFFFFF"
    dark: "#000000"

# Custom fonts (Inter for body, Bebas Neue for headings — matches kinetk.ai).
# Re-enable once WOFF2 files are added under ./assets/fonts/.
# typography:
#   bodyFont:
#     name: Inter
#     path: ./assets/fonts/Inter-Regular.woff2
#   headingsFont:
#     name: Bebas Neue
#     path: ./assets/fonts/BebasNeue-Regular.woff2

logo:
  href: https://kinetk.ai

favicon: ./assets/favicon.ico

navbar-links:
  - type: minimal
    text: kinetk.ai
    url: https://kinetk.ai
  - type: filled
    text: Get Your API Key
    url: https://platform.kinetk.ai
